[settings]
minimum_release_age = "0"

[env]
# conda:git below exports CONDA_PREFIX to every child process, and a Python
# tool then looks for site-packages inside the Git package. This repository has
# no conda environment, so remove the variable.
CONDA_PREFIX = false

[tools]
# Git 2.54 and later lets hk install config-based hooks instead of script
# shims, so the hook mechanism does not depend on the host Git. The package is
# about 260 MB and every repository on the machine shares it.
"conda:git" = "latest"
jactionlint = "latest"
"github:alecthomas/go-check-sumtype" = "latest"
"github:nnutter/mdlint" = "latest"
"github:nnutter/timber" = "latest"
"github:securego/gosec" = "latest"
gitleaks = "latest"
go = "latest"
"go:github.com/kisielk/errcheck" = "latest"
"go:github.com/kojah/gohawk" = "latest"
"go:github.com/nnutter/testifylint" = "latest"
"go:go.uber.org/nilaway/cmd/nilaway" = "latest"
"go:golang.org/x/tools/cmd/goimports" = "latest"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
gofumpt = "latest"
hk = "2.11.1"
pkl = "latest"
"pypi:agentskills-tools" = "latest"
# agentskills-tools needs pyyaml, which has no CPython 3.15 wheel.
# Keep upgrades on 3.14 because the pypi backend installs with --no-build.
python = "3.14"
staticcheck = "latest"
tombi = "latest"
uv = "latest"
yamlfmt = "latest"

[tasks.upgrade]
description = "Upgrade the tools to their newest releases"
run = [
  "mise upgrade",
  # The tools of this repository wait for the age of the setting, so they
  # need the age of zero to leave the queue.
  "mise upgrade --minimum-release-age 0 github:nnutter/timber@latest",
  "mise upgrade --minimum-release-age 0 github:nnutter/mdlint@latest",
  "mise lock --minimum-release-age 0 github:nnutter/timber@latest",
  "mise lock --minimum-release-age 0 github:nnutter/mdlint@latest",
  "mise lock",
]

[tasks.all]
description = "Run fix, test, and check"
run = [{ task = "fix" }, { task = "test" }, { task = "check" }]

[tasks.ci-test]
description = "Run tests with the race detector and shuffled order"
run = "go test -race -shuffle=on ./..."

[tasks.coverage]
description = "Run tests and generate coverage report"
run = "go test -coverprofile=coverage.out -covermode=atomic ./... && go tool cover -func=coverage.out"

[tasks.setup]
description = "Install hk git hooks"
run = "hk install --mise"

[tasks.test]
description = "Run tests with coverage"
run = "go test -cover ./..."

[tasks.fix]
description = "Fix all files, or only the supplied files"
usage = 'arg "[staged_files]" var=#true'
run = '''
if [ -z "${usage_staged_files:-}" ]; then
  hk fix --all
else
  hk fix ${usage_staged_files}
fi
'''

[tasks.check]
description = "Check all files without writing fixes"
run = "hk check --all"

[tasks.on-start]
description = "Run fix, test, and check before the agent starts"
run = [{ task = "all" }]

[tasks.on-stop]
description = "Fix edited files, then test and check"
usage = 'arg "[staged_files]" var=#true'
run = ["mise run fix ${usage_staged_files}", "mise run test", "mise run check"]
